<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teste Mapa 3D - Minha Localização</title>
  
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  
  <style>
    body { margin: 0; padding: 0; background-color: #121417; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
  </style>
</head>
<body>

  <div id="map"></div>

  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

  <script>
    // 1. Inicializa o mapa (Ele começa em São Paulo por padrão)
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://api.maptiler.com/maps/streets-v2-dark/style.json?key=1210fmf60PURWzVOx1Ow',
      center: [-46.7093, -23.6270], // Coordenada inicial (São Paulo)
      zoom: 15,
      pitch: 60,
      bearing: -20
    });

    map.dragRotate.enable(); 
    map.touchZoomRotate.enableRotation();

    // 2. A MÁGICA ACONTECE AQUI: Pedindo a localização ao navegador
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        // Se o usuário permitir a localização:
        (position) => {
          const lon = position.coords.longitude;
          const lat = position.coords.latitude;

          console.log("Sua localização:", lon, lat);

          // O MapLibre "voa" até a sua localização atual
          map.flyTo({
            center: [lon, lat], // Suas coordenadas reais
            zoom: 16,           // Aproxima um pouco mais
            pitch: 60,          // Mantém o 3D
            essential: true,
            duration: 3000      // Demora 3 segundos para fazer o voo
          });
        },
        // Se o usuário negar ou der erro:
        (error) => {
          console.error("Erro ao obter localização:", error);
          alert("Não foi possível obter sua localização. Verifique as permissões do navegador.");
        }
      );
    } else {
      alert("Seu navegador não suporta geolocalização.");
    }

    // 3. Deixando os prédios escuros
    map.on('load', () => {
      const layers = map.getStyle().layers;
      layers.forEach(layer => {
        if (layer.id.includes('building') && layer.type === 'fill-extrusion') {
          map.setPaintProperty(layer.id, 'fill-extrusion-color', '#1a1e23');
          map.setPaintProperty(layer.id, 'fill-extrusion-opacity', 0.95);
          map.setPaintProperty(layer.id, 'fill-extrusion-height', ['get', 'render_height']);
        }
      });
    });
  </script>

</body>
</html>
